<!DOCTYPE html>
<html lang ="en">
<head><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<meta charset="UTF-8">
<title>KG2 Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

<style>
body {
  font-family: "Poppins",serif;
  background: linear-gradient(90deg, #fff5f8, #ffe4ec);
  text-align:center;
}

.hidden{display:none;}

.word{
  display:inline-block;
  background:white;
  padding:10px;
  margin:6px;
  border-radius:10px;
  cursor:pointer;
}

button{
  padding:10px 20px;
  margin:15px;
  border-radius: 8px;
  border: none;
  background:#ff69b4;
  color:white;
  cursor:pointer;
  font-weight: bold;
  font-size: x-large ;
  transition: all 0.2s ease;
}

button:hover{
  background:#ff4da6;
  transition: all 0.2s ease;
  transform: scale(1.05);

  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
button:active{
  transform: scale(0.9);
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}


input{
  border:none;
  border-bottom:2px solid #ff69b4;
  outline:none;
  font-size:18px;
  text-align:center;
}
.text {
  color: #d63384;
  font-weight: bolder;

}
@keyframes popIn{

  from{transform: scale(0); opacity:0;}

  to{transform: scale(1); opacity:1;}

}
.word {
  animation: popIn 0.2s ease;
  background: white;
  border: 2px solid #ff69b4;
  transition: all 0.2s ease;
}

.word:hover {
  transform: scale(1.12);
  box-shadow: 0 5px 10px rgba(0,0,0,0.15);
}

.word:active {
  transform: scale(0.95);
}
.word.selected {
  background: #ffb6c1;
  transform: scale(1.1);
}

#question{
  color:#6a1b9a;
  font-size:24px;
  margin:50px 0 20px 0;
  font-weight: bold;
}



#popup{
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:25px 40px;
  border-radius:12px;
  font-size:28px;
  color:white;
  display:none;
  z-index:999;
  animation: popAnim 0.3s ease, fadeOut 1.2s ease forwards;


}
@keyframes fadeOut{

  0%{opacity:1;}

  80%{opacity:1;}

  100%{opacity:0;}

}

@keyframes popAnim{
  from{ transform:translate(-50%,-60%) scale(0.8); opacity:0; }
  to{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}


.schoolHeader {
  text-align: center;
  margin-top: 20px;
  margin-bottom: 30px;
  padding: 20px;
  animation: popIn 0.4s ease;

}

.schoolName {
  font-size: 40px;
  font-weight: 700;
  color: #d63384;
  letter-spacing: 1px;
}

.schoolSub {
  font-size: 20px;
  color: #d63384;
  margin-top: 4px;
  letter-spacing: 2px;
}

.className {
  display: inline-block;
  margin-top: 5px;
  padding: 6px 14px;
  background: #ff69b4;
  color: white;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bolder;
}
a{cursor:pointer;color:blue;}
#loginPage, #studentPage, #teacherPage,#loginCard

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.badge{
  background: linear-gradient(45deg, gold, orange);
  color: black;
  padding: 12px 25px;
  border-radius: 25px;
  font-weight: bold;
  font-size: 22px;
  display: inline-block;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
#soundBtn{
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  font-size: 24px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 1000;

}
#studentPage, #teacherPage, #quizPage, #finishPage ,#loginCard ,#reportPage{
  max-width: 500px;
  margin: auto;
  background: #fffdfd;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0  10px 30px rgba(0,0,0,0.1);
  border: 5px solid rgba(255,105,180,0.2);
}

#answerBox{
  min-height: 60px;
  max-width: 500px;
  margin: 20px auto;
  padding: 15px;
  border-radius: 15px;
  background: #ffffff;
  border: 4px dashed #ff69b4;
  font-size: 25px;
  color: #333;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

</style>
</head>

<body>
<br>

<div class="schoolHeader">
  <div class="schoolName">GEMS MILLENNIUM SCHOOL</div>
  <div class="schoolSub">SHARJAH</div>
  <br>
  <div class="className">KG2 H</div>
</div>

<div id="popup"></div>

<!-- LOGIN -->
<div id="loginCard">
<div id="loginPage">
  <h2>Choose Role:</h2>
  <br>

  <button onclick="showStudent()">Student</button>
  <br>
  <br>
  <button onclick="showTeacher()">Teacher</button>
</div>
</div>

<!-- STUDENT -->
<div id="studentPage" class="hidden">
  <h2 id="Qstatus">Loading Questions...</h2>
  <input id="studentName" placeholder="Enter Name"><br>
  <button onclick="startQuiz()">Start Quiz</button>
  <br>
  <br>
  <button onclick="goToLogin()">Back to Login</button>
</div>

<!-- TEACHER -->
<div id="teacherPage" class="hidden">
  <label for="pin"></label><input id="pin" type="password" placeholder="Enter PIN"><br>
  <br>
  <button onclick="loginTeacher()">Login</button>
  <br>
  <br>
  <button onclick="goToLogin()">Back to Login</button>
</div>

<!-- QUIZ -->
<div id="quizPage" class="hidden">

  <div id="question"></div>
  <h2 id = "prog"></h2>
  <div id="words"></div>
  <div id="answerBox"></div>

  <button onclick="submitAnswer()">Submit</button>
  <button onclick="resetAnswer()">Reset</button>
  <br>
  <br>
  <button onclick="goToLogin()">Back to Login</button>
</div>

<!-- FINISH -->
<div id="finishPage" class="hidden">
  <h1 id ="score"></h1>
  <h2 style="color:green;">🎉 FINISHED 🎉</h2>

  <h3 id ="badge"></h3>
  <button onclick="goToLogin()">Back to Login</button>
</div>

<!-- REPORT -->
<div id="reportPage" class="hidden">
  <h2 class = "text">Teacher Report</h2>
  <br>
  <h2 class="text">Student Data Available on the Google Sheet Given Below</h2>
  <br>
  <a href="https://docs.google.com/spreadsheets/d/11o0e2U56z9S_G7oJ-rG6IVu5QEd1Fj3_f63_O4SZRw8/edit?usp=sharing"
  target="_blank"
  style="display:inline-block;padding:10px 16px;background:green;color:white;border-radius:8px;text-decoration:none;font-weight:bold;margin:10px 0;">
  📊 GOOGLE SHEET
  </a>

  <br>
   <h2 class="text">Questions Are On Google Sheet Given Below</h2>
  <br>
  <a href="https://docs.google.com/spreadsheets/d/1PbZGhpo_IEH1bLLQ4Dgfm_GZe_jvpML7z7JAuS73kFU/edit?usp=sharing"
  target="_blank"
  style="display:inline-block;padding:10px 16px;background:green;color:white;border-radius:8px;text-decoration:none;font-weight:bold;margin:10px 0;">
  📝 QUESTIONS
  </a>
  <br>
  <br>

  <button onclick="goToLogin()">Back to Login</button>
</div>

<!-- DETAIL -->
<div id="detailPage" class="hidden">
  <button onclick="backToReports()">⬅ Back</button>
  <h3 id="studentTitle"></h3>
  <div id="detail"></div>
</div>
<audio id="correctS" src="correct.mp3"></audio>
<audio id="wrongS" src="incorrect.mp3"></audio>
<audio id="clapS" src="clap.mp3"></audio>
<button id="soundBtn" onclick="toggleSound()">🔊</button>
<script>

let questions = [];
let questionsLoaded = false;
let muted = false;

let i=0;
let answer=[];
let wrongAttempts=0;
let student="";
let results=[];
let reports = [];

/* POPUP */
function pop(msg,color){
 let p=document.getElementById("popup");
 p.innerText=msg;
 p.style.background=color;
 p.style.display="block";
 setTimeout(()=>p.style.display="none",1200);
}

/* RESET VIEW */
function hideAll(){
 loginPage.classList.add("hidden");
 studentPage.classList.add("hidden");
 teacherPage.classList.add("hidden");
 quizPage.classList.add("hidden");
 finishPage.classList.add("hidden");
 reportPage.classList.add("hidden");
 detailPage.classList.add("hidden");
 loginCard.classList.add("hidden")
}

/* NAV */
function showStudent(){
 hideAll();
 studentPage.classList.remove("hidden");
}

function showTeacher(){
 hideAll();
 teacherPage.classList.remove("hidden");
}

function goToLogin(){
 hideAll();
 loginPage.classList.remove("hidden");
 loginCard.classList.remove("hidden")
}

/* TEACHER LOGIN */
function loginTeacher(){
 if(pin.value==="321"){
  showReports();
 } else {
  pop("Wrong PIN Try Again","red");
  pin.value="";
 }
}

/* SHOW REPORTS (FIXED NAVIGATION) */
function showReports(){
 hideAll();
 reportPage.classList.remove("hidden");
}

/* STUDENT START */
function startQuiz(){

  student = studentName.value || "Student";

  if(studentName.value === ""){
    pop("Enter Name","red");
    return;
  }

  if(!questionsLoaded || questions.length === 0){
    pop("Loading questions... try again in 5 sec","orange");
    return;
  }

  i = 0;
  results = [];
  wrongAttempts = 0;
  answer = [];

  hideAll();
  quizPage.classList.remove("hidden");
  loadQ();
}

function shuffle(a){
 return a.sort(()=>Math.random()-0.5);
}

function loadQ(){
 if(i>=questions.length){
   launchConfetti();
   save();
   hideAll();
   finishPage.classList.remove("hidden");

   return;
 }

 answer=[];
 wrongAttempts=0;

 let wordsArr = shuffle(questions[i].split(" "));
 let prog = document.getElementById("prog")
 question.innerText="Arrange the sentence:";
 words.innerHTML="";
 let score = results.filter(r => r.s === "Correct").length;
 prog.innerText = `Score : ${score}/${questions.length}`
 answerBox.innerText="";

 wordsArr.forEach(w=>{
  let s=document.createElement("span");
  s.className="word";
  s.innerText=w;
  s.onclick=()=>{
    if(s.classList.contains("used")) return;
    s.classList.add("used")
    s.style.background = "#ffb6c1";
    s.classList.add("selected");

    add(w);};
  words.appendChild(s);
 });
}

function add(w){
 answer.push(w);
 answerBox.innerText=answer.join(" ");
}

function resetAnswer(){
 answer=[];
 answerBox.innerText="";



 let allWords = document.querySelectorAll(".word");
 allWords.forEach(w=>{
   w.style.background = "white";
   w.classList.remove("used")
   w.classList.remove("selected")
 });
}

function submitAnswer(){
 let user=answer.join(" ");
 let correct=questions[i];
 let correctS= document.getElementById("correctS")
  let wrongS = document.getElementById("wrongS")
  correctS.volume = 0.4;
  wrongS.volume = 0.4;
 if(user===correct){
   if (!muted){
     correctS.currentTime = 0;
   correctS.play();}
  results.push({q:correct,a:user,s:"Correct"});
  pop("CORRECT","green");
  i++;
  setTimeout(loadQ,500);
 } else {
   if (!muted){
     wrongS.currentTime = 0;
   wrongS.play()}
  wrongAttempts++;
  results.push({q:correct,a:user,s:"Wrong"});
  pop("WRONG","red");
  resetAnswer();

  if(wrongAttempts>=2){
    pop("Correct Answer: " + correct, "blue");

  i++;

  setTimeout(loadQ,500);
  }
 }
}


function save(){

  let score = results.filter(r => r.s === "Correct").length;
  let badge_text = document.getElementById("badge")
  if (score === results.length){
    badge_text.innerHTML='<span class = "badge">Perfect! ⭐️⭐️⭐️</span> '

  }
  else if (score >= questions.length/2){
    badge_text.innerHTML='<span class = "badge">Good! ⭐⭐️️️</span> '
  }
  else{
    badge_text.innerHTML='<span class = "badge">Keep Practicing! ⭐️</span> '
  }
  let score_text = document.getElementById("score")
  score_text.innerText=`${score}/${questions.length}`


let payload = {
  name: student,
  score: score,
  total: questions.length,
  details: JSON.stringify(results)
};


  fetch("https://script.google.com/macros/s/AKfycbxg4imblGO5GIuR-xtdeeOKi6-6rFURZ9SSlOQXPABErutPzg4Hf-6kvm3jGADXNLRJ/exec", {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(response => console.log("Data sent "))
  .catch(error => console.error("Error sending data:", error));


  reports.push({name:student,data:results});

}

/* REPORT LIST */







/* FIXED BACK BUTTON */
function backToReports(){
 showReports();
}
function launchConfetti(){
  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });
  let clapS = document.getElementById("clapS")
  clapS.volume = 0.2
  if (!muted){
    clapS.currentTime = 0;
  clapS.play();}
}
function loadQuestionsFromSheet(){
  fetch("https://script.google.com/macros/s/AKfycbymwj29ccQOdn08o2CIOjdo5vE5zH1cCbJaTZlN8V9GIKXvsqzhVWQRBUO_X_ztH2Te/exec")
  .then(res => res.json())
  .then(data => {
    questions = data;
    questionsLoaded = true;
    let Qstatus = document.getElementById("Qstatus")
    Qstatus.innerText="Questions Loaded"
    questions = questions.sort(()=>Math.random()-0.5);
    console.log("Questions loaded:", questions);
  })
  .catch(err => {
    console.error("Failed to load questions", err);
  });
}
function toggleSound(){
  muted = !muted
  let soundB = document.getElementById("soundBtn")
  if (muted){
    soundB.innerText="🔇";
  }
  else{
    soundB.innerText="🔊";
  }
}
window.onload = function(){
  loadQuestionsFromSheet();

  let check = setInterval(()=>{
    if(questions.length > 0){
      clearInterval(check);
      console.log("Ready to start ");
    }
  },500);
};

</script>

</body>
</html>
